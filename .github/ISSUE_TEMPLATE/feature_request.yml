name: Feature request
description: Suggest a focused improvement to BambuMCPSharp.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior and any alternatives considered.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and protocol impact
      description: Note any printer writes, file operations, authentication changes, new dependencies, or native-code requirements.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included credentials, printer identifiers, private addresses, local paths, logs, snapshots, or sliced files.
          required: true
